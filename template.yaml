AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  DeadlineIQ — academic deadline tracking and prioritisation.
  AWS x NYP Cloud Hackathon 2026, PS-3. One shared stack, four contributors.

# ============================================================================
#  HOW TO USE THIS FILE  (PROJECT_IMPLEMENTATION_PHASES.md §3.2)
#
#  Add your functions inside YOUR OWN comment block, near the bottom.
#  Everything above the member blocks is SHARED — ask Philena before editing.
#
#  Deploy your own functions yourself; nobody queues on anybody:
#      sam build && sam deploy
#
#  Every function needs `Role: !Sub ...${LambdaRoleName}` on it, because the
#  Learner Lab forbids creating IAM roles and SAM Globals does not support
#  `Role`. Copy the line from an existing function.
# ============================================================================

Parameters:
  TableName:
    Type: String
    Default: deadlineiq
    Description: Single DynamoDB table (HLD §5.2).

  LambdaRoleName:
    Type: String
    Default: LabRole
    Description: >
      Pre-provisioned execution role. The AWS Academy Learner Lab forbids
      creating IAM roles and forces LabRole, so every function assumes it.
      Outside the Lab, point this at a role you created.

  FrontendUrl:
    Type: String
    Default: http://localhost:5173
    Description: >
      Exact Vercel origin. This is the CORS allowlist — never '*'
      (AGENTS §13). No trailing slash.

  JwtSecret:
    Type: String
    NoEcho: true
    Description: HS256 signing secret for auth tokens. Never committed.

  AiApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      OpenRouter key. Deploy with this BLANK to run the mandatory kill-switch
      test (AGENTS §15.1) — every AI feature must still work without it.

  AiModel:
    Type: String
    Default: ''
    Description: Free-tier chat model id.

  # --- UC-019/UC-023 (Zoe). Added for the reminder pipeline; flagged to
  #     Philena because Parameters is a shared section. ---------------------
  CronSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Gates POST /api/reminders/run, the manual trigger used to demonstrate
      the pipeline on stage. Blank means the route is closed, never open.

  ReminderEmail:
    Type: String
    Default: ''
    Description: >
      Address subscribed to the reminder SNS topic. AWS sends a confirmation
      link on first deploy — click it before the demo or nothing is delivered.

  SmtpHost:
    Type: String
    Default: ''
    Description: Nodemailer fallback, used only when SNS is blocked (UC-019 E5).

  SmtpUser:
    Type: String
    Default: ''

  SmtpPass:
    Type: String
    Default: ''
    NoEcho: true

Conditions:
  # Zoe (UC-019): the email subscription only exists once an address is given,
  # so a deploy with ReminderEmail blank still creates the topic and succeeds.
  HasReminderEmail: !Not [!Equals [!Ref ReminderEmail, '']]

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    CodeUri: backend/
    Environment:
      Variables:
        TABLE_NAME: !Ref TableName
        FRONTEND_URL: !Ref FrontendUrl
        JWT_SECRET: !Ref JwtSecret
        AI_API_KEY: !Ref AiApiKey
        AI_MODEL: !Ref AiModel
        NODE_ENV: production
    # Function-specific variables (S3_BUCKET, SNS_TOPIC_ARN, SMTP_*,
    # CRON_SECRET) go on the individual function that needs them, in the
    # owning member's block below.

Resources:

  # ==========================================================================
  # ===== SHARED — Philena only ==============================================
  # ==========================================================================

  # --- DynamoDB: the single table (HLD §5.2) --------------------------------
  #
  # GSI1 is SPARSE: only TASK# items carry GSI1PK/GSI1SK, so a Query on the
  # index returns exactly the tasks and never has to filter out milestones,
  # modules or prefs. Every access pattern in HLD §5.4 resolves to a Query.
  # There is no Scan anywhere in this system.
  DeadlineIqTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST      # never provisioned — HLD §10.5
      AttributeDefinitions:
        - { AttributeName: PK,     AttributeType: S }
        - { AttributeName: SK,     AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: deadline-index
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  # --- API Gateway: the REST front door ------------------------------------
  #
  # Every route is authorised by default. Public routes opt out explicitly
  # with `Auth: {Authorizer: NONE}` on their event — there are exactly three:
  # register, login and refresh.
  DeadlineIqApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: !Sub "'${FrontendUrl}'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: JwtAuthorizer
        # The preflight OPTIONS request carries no Authorization header, so
        # authorising it would break CORS for every route.
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          JwtAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            FunctionPayloadType: TOKEN
            Identity:
              Header: Authorization
              ReauthorizeEvery: 300      # HLD §10.1 — cache the policy 5 min
      # A 401 raised by the authoriser is generated by API Gateway, not by our
      # code, so without these it would arrive with no CORS header and no
      # {code,message} body — the browser would report an opaque network
      # error and the frontend could never branch on it (UC-001 E3).
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${FrontendUrl}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          ResponseTemplates:
            application/json: '{"code":"unauthorised","message":"Please sign in again."}'
        ACCESS_DENIED:
          StatusCode: 401
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${FrontendUrl}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          ResponseTemplates:
            application/json: '{"code":"unauthorised","message":"Please sign in again."}'

  # --- Lambda authoriser (UC-001 step 8) ------------------------------------
  #
  # Verifies the JWT and injects userId into the request context. This is the
  # ONLY place userId enters the system — no handler reads it from a body.
  #
  # Least privilege (documented per HLD §10.4; LabRole is broader in the Lab):
  #   logs:CreateLogStream, logs:PutLogEvents on its own log group. No table
  #   access at all — it verifies a signature and nothing else.
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: authorizer/index.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}

  # ==========================================================================
  # ===== PHILENA ============================================================
  # ==========================================================================

  # UC-001 — register. Writes EMAIL# guard + PROFILE + PREFS in one
  # TransactWriteItems, so a duplicate email leaves no orphan items.
  # Least privilege: dynamodb:PutItem on the table (transactional).
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/auth/register.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Register:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/auth/register
            Method: post
            Auth:
              Authorizer: NONE

  # UC-001 Alt A — sign in. One generic message for both failure modes.
  # Least privilege: dynamodb:GetItem on the table.
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/auth/login.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/auth/login
            Method: post
            Auth:
              Authorizer: NONE

  # UC-001 E3 — silent refresh. Deliberately NOT behind the authoriser: an
  # expired token is exactly the input this endpoint exists to accept, and the
  # authoriser would reject it before the handler ever ran.
  # Least privilege: none — it re-signs a token it has verified.
  RefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/auth/refresh.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Refresh:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/auth/refresh
            Method: post
            Auth:
              Authorizer: NONE

  # UC-001 — the session bootstrap the frontend calls on load.
  # Least privilege: dynamodb:GetItem on the table.
  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/users/me.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Me:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/users/me
            Method: get

  # UC-002 — create a task. Scores the full active set synchronously and
  # returns the created task with its priorityScore and subScores.
  # Least privilege: dynamodb:Query, PutItem, UpdateItem on the table.
  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/tasks/create.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        CreateTask:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/tasks
            Method: post

  # UC-003 — the task index the detail screen is reached from.
  # Least privilege: dynamodb:Query on the table.
  ListTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/tasks/list.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        ListTasks:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/tasks
            Method: get

  # UC-003 steps 1–2 — task detail, with its milestones.
  # Least privilege: dynamodb:Query on the table.
  GetTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/tasks/get.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        GetTask:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/tasks/{taskId}
            Method: get

  # UC-003 steps 3–6 — partial update, conditional on updatedAt, then a
  # rescore of the full active set.
  # Least privilege: dynamodb:Query, UpdateItem, PutItem on the table.
  PatchTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/tasks/patch.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        PatchTask:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/tasks/{taskId}
            Method: patch

  # UC-004 [P-08] — read the student's settings. Class A read.
  # Least privilege: dynamodb:GetItem on the table.
  GetPrefsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/modules-prefs/get.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        GetPrefs:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/prefs
            Method: get

  # UC-004 step 7 — availability feeds EffortPressure directly, so saving it
  # rescores the whole active set rather than waiting for the hourly job.
  # That is what makes the UC-018 heatmap re-shade under the student's hand.
  #
  # NOTE (Hasini): also written out of my track — UC-018 Alt B has no demo
  # without it. Modules (UC-004 steps 2-3) are still unwritten and yours.
  # Least privilege: dynamodb:Query and UpdateItem on the table.
  PutPrefsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/modules-prefs/put.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        PutPrefs:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/prefs
            Method: put

  # UC-003 steps 7–8 — soft delete. Nothing is ever hard-deleted.
  # Least privilege: dynamodb:Query, UpdateItem on the table.
  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/tasks/remove.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        DeleteTask:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/tasks/{taskId}
            Method: delete

  # UC-003 step 9 — the 10-second undo.
  # Least privilege: dynamodb:Query, UpdateItem on the table.
  RestoreTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/tasks/restore.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        RestoreTask:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/tasks/{taskId}/restore
            Method: post

  # UC-004 — modules. Least privilege: dynamodb:Query on the table.
  ListModulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/modules-prefs/modulesList.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        ListModules:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/modules
            Method: get

  # Least privilege: dynamodb:PutItem (conditional) on the table.
  CreateModuleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/modules-prefs/modulesCreate.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        CreateModule:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/modules
            Method: post

  # Least privilege: dynamodb:UpdateItem on the table.
  PatchModuleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/modules-prefs/modulesPatch.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        PatchModule:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/modules/{code}
            Method: patch


  # --- Study companion (beyond the 23 UCs; product-owner request) ----------
  # Points are DERIVED from completed tasks, so these functions can only ever
  # read tasks and write the CHARACTER item.
  # Least privilege: dynamodb:Query on the table.
  GetCharacterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/character/get.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        GetCharacter:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/character
            Method: get

  # Least privilege: dynamodb:GetItem, UpdateItem on the table.
  PutCharacterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/character/put.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        PutCharacter:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/character
            Method: put

  # Least privilege: dynamodb:Query, UpdateItem on the table.
  PurchaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/character/purchase.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Purchase:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/character/purchase
            Method: post

  # ==========================================================================
  # ===== MAHDIYA ============================================================
  # ==========================================================================
  # S3 bucket + presign, UC-005 parse, UC-006 briefs/extract, UC-007 bulk
  # import, UC-008 progress. Put S3_BUCKET on your own functions' Environment.

  # --- S3: assignment brief uploads (UC-006) --------------------------------
  #
  # Files arrive on a presigned PUT straight from the browser, so the bucket
  # needs CORS for the frontend origin. Objects are keyed briefs/<userId>/…
  # and the bucket stays private — the presigned URL is the only way in.
  BriefsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub deadlineiq-briefs-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref FrontendUrl]
            AllowedMethods: [PUT]
            AllowedHeaders: ['*']
            MaxAge: 300

  # UC-006 step 2 — presigned PUT, 5-minute expiry, 5 MB cap (validated in
  # the handler). Least privilege: s3:PutObject on BriefsBucket.
  BriefsPresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/briefs/presign.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Environment:
        Variables:
          S3_BUCKET: !Ref BriefsBucket
      Events:
        Presign:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/briefs/presign
            Method: post

  # UC-006 steps 4–6 — extraction runs on text the browser already pulled out
  # client-side (pdfjs-dist/mammoth). For a scanned/image brief (Alt A) it
  # instead presigns a short-lived GET on the S3 object and sends that URL to
  # a vision-capable model — the object bytes still never pass through this
  # Lambda. 30 s per AGENTS §3 — the text budget plus the model call.
  # Least privilege: s3:GetObject on BriefsBucket only (for the presign).
  BriefsExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/briefs/extract.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Timeout: 30
      Environment:
        Variables:
          S3_BUCKET: !Ref BriefsBucket
      Events:
        Extract:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/briefs/extract
            Method: post

  # UC-005 — quick parse. AI-first, chrono-node + regex fallback. Reads
  # existing module codes/tasks for context (best-effort), never writes.
  # Least privilege: dynamodb:Query on the table.
  QuickParseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/parse/quick.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Timeout: 15
      Events:
        QuickParse:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/parse
            Method: post

  # UC-007 steps 1–4 — the batched review-table parse. One model call for the
  # whole paste, chrono-node per line when it is unavailable (E3).
  # Least privilege: dynamodb:Query on the table.
  BulkParseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/parse/bulk.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Timeout: 15
      Events:
        BulkParse:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/parse/bulk
            Method: post

  # UC-007 steps 5–7 — commits the ticked rows via BatchWriteItem, then
  # rescores the full active set. The one write path in this track that does
  # not go through /api/tasks (HLD's endpoint table only documents the
  # preview step above; this sibling follows UC-012's generate → PUT shape).
  # Least privilege: dynamodb:Query, BatchWriteItem, UpdateItem on the table.
  BulkImportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/parse/bulkImport.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        BulkImport:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/parse/bulk/import
            Method: post

  # UC-008 — percentage slider and/or logged hours. Rescores the full active
  # set (EffortPressure/ProgressDeficit both move). Milestone-driven progress
  # goes through Hasini's milestones/patch.js instead (UC-012), not this.
  # Least privilege: dynamodb:Query, UpdateItem on the table.
  ProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/progress/logProgress.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        LogProgress:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/tasks/{taskId}/progress
            Method: post

  # ==========================================================================
  # ===== HASINI =============================================================
  # ==========================================================================
  # UC-010 explain, UC-011 focus, UC-012 milestones, UC-013/018 workload,
  # UC-014 plan, UC-015 weights, UC-009 ranking view.
  #
  # Every function here loads the student's whole partition with ONE Query on
  # PK = USER#<userId> (lib/loadRanked.js) and scores it in process. There is
  # no Scan and no second round trip, which is what keeps the Class A reads
  # inside their 500 ms budget.
  #
  # Only ExplainFunction and MilestonesGenerateFunction ever reach the model,
  # and both are Class C with a deterministic fallback. Every other function
  # below is a read or write path, where an LLM call would be a bug (§7).

  # UC-009 — the ranking view. Class A read.
  # Least privilege: dynamodb:Query and UpdateItem on the table.
  RankingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/views/ranking.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Ranking:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/ranking
            Method: get

  # UC-010 — narration. Class C: the model sits behind a 6 s timeout and the
  # template sentence behind that, so this endpoint never returns an error.
  #
  # Timeout 15 s, not the 10 s default: a 6 s model call plus the partition
  # read plus the explanation write has no headroom inside 10.
  # Least privilege: dynamodb:Query and UpdateItem on the table.
  ExplainFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/explain/explain.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Timeout: 15
      Events:
        Explain:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/explain
            Method: post

  # UC-011 — Focus Mode. Class A read: serves the cached or template sentence
  # and never calls the model, so the card cannot block on a rate limit.
  # Least privilege: dynamodb:Query on the table.
  FocusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/focus/get.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Focus:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/focus
            Method: get

  # UC-012 — the breakdown proposal. Class C, and it writes nothing: the
  # student accepts it through MilestonesPutFunction below.
  # Least privilege: dynamodb:GetItem and Query on the table.
  MilestonesGenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/milestones/generate.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Timeout: 15
      Events:
        GenerateMilestones:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/tasks/{taskId}/milestones/generate
            Method: post

  # UC-012 step 6 — accept the breakdown. All or nothing.
  # Least privilege: dynamodb:GetItem, Query, TransactWriteItems on the table.
  MilestonesPutFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/milestones/put.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        PutMilestones:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/tasks/{taskId}/milestones
            Method: put

  # UC-012 step 7 — tick a milestone. This drives the parent's progressPct, so
  # the full active set is rescored: ClashPenalty is cross-task.
  # Least privilege: dynamodb:Query and UpdateItem on the table.
  MilestonePatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/milestones/patch.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        PatchMilestone:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/tasks/{taskId}/milestones/{id}
            Method: patch

  # UC-013 — crash weeks on their own, for callers that do not want the grid.
  # Least privilege: dynamodb:Query on the table.
  CrashWeeksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/workload/crashWeeks.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        CrashWeeks:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/workload/crash-weeks
            Method: get

  # UC-013 step 6 — enact the recommendation, then rescore so the red cell
  # visibly lightens. {weekStart} is a full ISO timestamp, percent-encoded by
  # the browser; API Gateway decodes it once before the handler sees it.
  # Least privilege: dynamodb:Query, TransactWriteItems, UpdateItem.
  CrashWeekApplyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/workload/apply.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        ApplyCrashWeek:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/workload/crash-weeks/{weekStart}/apply
            Method: post

  # UC-013 step 7 — quiet that week's card for 48 hours.
  # Least privilege: dynamodb:GetItem and UpdateItem on the PREFS item.
  CrashWeekDismissFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/workload/dismiss.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        DismissCrashWeek:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/workload/crash-weeks/{weekStart}/dismiss
            Method: post

  # UC-018 — the 12-week heatmap. Class A read. It returns the crash weeks
  # alongside the grid so both come from one round trip.
  # Least privilege: dynamodb:Query on the table.
  HeatmapFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/workload/heatmap.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Heatmap:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/workload/heatmap
            Method: get

  # UC-014 — today's plan. Class A read: allocation arithmetic, no model call.
  # Least privilege: dynamodb:Query on the table.
  PlanTodayFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/plan/today.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        PlanToday:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/plan/today
            Method: get

  # UC-015 step 7 — persist the weightings the student previewed client-side.
  # Class B write; weights are normalised to sum 1.0 before they are stored.
  # Least privilege: dynamodb:Query and UpdateItem on the table.
  WeightsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/weights/put.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        PutWeights:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/prefs/weights
            Method: put

  # ==========================================================================
  # ===== ZOE ================================================================
  # ==========================================================================
  # UC-019 EventBridge rules + reminder Lambda (Timeout: 30), SNS topic,
  # UC-020 notification prefs, UC-021 overdue, UC-022 completed, UC-023 .ics.
  # Put SNS_TOPIC_ARN / SMTP_* / CRON_SECRET on your own functions.
  #
  # THE AWS STORY, as one resource graph:
  #   DynamoDB → EventBridge (2 rules) → one Lambda → SNS → CloudWatch.
  # Both rules target the SAME function with different input payloads, so
  # there is one handler to maintain and one log group to point a judge at.

  # --- SNS: reminder delivery (UC-019 step 7) -------------------------------
  #
  # If the Learner Lab audit finds SNS blocked, leave ReminderEmail blank and
  # set SmtpHost instead — lib/notify/send.js switches on SNS_TOPIC_ARN being
  # present, so no handler changes (UC-019 E5).
  ReminderTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: DeadlineIQ

  ReminderSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasReminderEmail
    Properties:
      Protocol: email
      Endpoint: !Ref ReminderEmail
      TopicArn: !Ref ReminderTopic

  # --- UC-016 dashboard. Class A read: one Query, one scoring pass, no LLM.
  # Least privilege: dynamodb:Query on the table, PutItem for the roster item.
  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/views/dashboard.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Dashboard:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/dashboard
            Method: get

  # --- UC-017 calendar + timeline spans.
  CalendarFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/views/calendar.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Calendar:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/calendar
            Method: get

  # --- UC-022 completed tasks + estimation accuracy.
  CompletedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/completed/list.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Completed:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/completed
            Method: get

  # --- UC-019: THE scheduled Lambda. Both EventBridge rules point here.
  #
  # 30 s (not the shared 10 s) because one invocation rescores every student;
  # it pages through the roster and writes a cursor before the clock runs out,
  # so the next tick resumes rather than restarting (E2).
  #
  # Least privilege: dynamodb:Query/UpdateItem/PutItem on the table,
  # sns:Publish on ReminderTopic, logs:* on its own group.
  ReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/reminders/scheduled.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Timeout: 30
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref ReminderTopic
          SMTP_HOST: !Ref SmtpHost
          SMTP_USER: !Ref SmtpUser
          SMTP_PASS: !Ref SmtpPass
      Events:
        HourlyRecompute:
          Type: Schedule
          Properties:
            Name: deadlineiq-hourly-recompute
            Schedule: rate(1 hour)
            Description: Rescore, transition overdue, nudge and escalate (UC-019).
            Input: '{"job":"recompute"}'
        DailyDigest:
          Type: Schedule
          Properties:
            Name: deadlineiq-daily-digest
            # 00:00 UTC = 08:00 SGT. One rule serves every timezone; each
            # student's own digestAt is honoured inside the handler (§10.2).
            Schedule: cron(0 0 * * ? *)
            Description: Morning digest — today's plan, top 3, anything overdue.
            Input: '{"job":"digest"}'

  # --- UC-019 Alt B: the manual trigger. Gated by CRON_SECRET in the
  # Authorization header, NOT by the JWT authoriser — the caller is a machine.
  ReminderRunFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/reminders/run.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Timeout: 30
      Environment:
        Variables:
          CRON_SECRET: !Ref CronSecret
          SNS_TOPIC_ARN: !Ref ReminderTopic
          SMTP_HOST: !Ref SmtpHost
          SMTP_USER: !Ref SmtpUser
          SMTP_PASS: !Ref SmtpPass
      Events:
        Run:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/reminders/run
            Method: post
            Auth:
              Authorizer: NONE

  # --- UC-020 step 6: "Send test notification" — real path, live proof.
  ReminderTestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/reminders/test.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Timeout: 15
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref ReminderTopic
          SMTP_HOST: !Ref SmtpHost
          SMTP_USER: !Ref SmtpUser
          SMTP_PASS: !Ref SmtpPass
      Events:
        TestNotification:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/reminders/test
            Method: post

  # --- UC-020 preferences and the in-app inbox.
  NotificationPrefsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/notif-prefs/put.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        PutNotificationPrefs:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/prefs/notifications
            Method: put

  NotificationsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/notif-prefs/list.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        ListNotifications:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/notifications
            Method: get

  NotificationReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/notif-prefs/read.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        ReadNotification:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/notifications/{id}/read
            Method: post

  # --- UC-021: the three honest resolutions for an overdue task.
  ResolveOverdueFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/overdue/resolve.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Resolve:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/tasks/{taskId}/resolve
            Method: post

  # --- UC-023: .ics download, feed token, and the public feed.
  ExportIcsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/export/ics.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        ExportIcs:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/export/ics
            Method: get

  FeedTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/export/feedToken.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        FeedToken:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/export/feed-token
            Method: post

  # A subscribing calendar arrives with no session, so this route is public.
  # The token IS the credential: 24 random bytes, revocable from settings.
  FeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/export/feed.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/${LambdaRoleName}
      Events:
        Feed:
          Type: Api
          Properties:
            RestApiId: !Ref DeadlineIqApi
            Path: /api/feed/{token}
            Method: get
            Auth:
              Authorizer: NONE

Outputs:
  ApiUrl:
    Description: API Gateway invoke URL — this becomes VITE_API_URL on Vercel.
    Value: !Sub https://${DeadlineIqApi}.execute-api.${AWS::Region}.amazonaws.com/prod

  TableName:
    Description: DynamoDB table name.
    Value: !Ref DeadlineIqTable

  ReminderTopicArn:
    Description: SNS topic reminders publish to (UC-019). Confirm the email subscription before the demo.
    Value: !Ref ReminderTopic

  BriefsBucketName:
    Description: S3 bucket for UC-006 assignment brief uploads.
    Value: !Ref BriefsBucket
